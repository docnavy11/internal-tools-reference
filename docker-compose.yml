services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5439:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_NAME: internal-tools
      APP_URL: http://localhost:3000
      APP_MODE: all
      PORT: '3000'
      LOG_LEVEL: info
      SESSION_SECRET: ${SESSION_SECRET:-compose-default-secret-change-me-in-production-please}
      DATABASE_URL: postgres://app:app@postgres:5432/app
      MIGRATE_ON_START: 'true'
      STORAGE_DRIVER: disk
      FILES_DIR: /app/data/files
    ports:
      - '3000:3000'
    volumes:
      - app-files:/app/data/files

  # Optional S3-compatible store for checking the s3 storage driver locally:
  #   docker compose --profile s3 up -d minio
  # Console at http://localhost:9001 (minioadmin / minioadmin). Create bucket "app".
  minio:
    image: minio/minio:latest
    profiles: ['s3']
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  app-files:
  minio-data:
