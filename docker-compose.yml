services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5439:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_NAME: internal-tools
      APP_URL: http://localhost:3000
      APP_MODE: all
      PORT: '3000'
      LOG_LEVEL: info
      SESSION_SECRET: ${SESSION_SECRET:-compose-default-secret-change-me-in-production-please}
      DATABASE_URL: postgres://app:app@postgres:5432/app
      MIGRATE_ON_START: 'true'
      # Phase 5 adds STORAGE_DRIVER=disk and FILES_DIR=/app/data/files here.
    ports:
      - '3000:3000'
    volumes:
      - app-files:/app/data/files

volumes:
  postgres-data:
  app-files:
